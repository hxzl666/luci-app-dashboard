name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_NAME: luci-app-dashboard

jobs:
  build-luci:
    name: Build LuCI packages (${{ matrix.sdk_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_arch: mediatek-filogic-24.10.5
            ver: "24.10"
          - sdk_arch: mediatek-filogic-25.12.5
            ver: "25.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local feed layout
        run: |
          rm -rf .feed
          mkdir -p .feed/${{ env.PKG_NAME }}
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.feed' \
            ./ ./.feed/${{ env.PKG_NAME }}/

      - name: Build LuCI package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_arch }}
          FEED_DIR: ${{ github.workspace }}/.feed
          PACKAGES: luci-app-dashboard
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Collect LuCI release assets
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          ver="${{ matrix.ver }}"
          if [ "$ver" = "24.10" ]; then
            suffix=""
            ext="ipk"
          else
            suffix="-$ver"
            ext="apk"
          fi

          echo "All built packages (${ext}):"
          find bin -type f -name "*.${ext}" | sort

          # ipk 命名: luci-app-dashboard_0.2.0-1_all.ipk (下划线)
          # apk 命名: luci-app-dashboard-0.2.0-r1.apk (横线)
          app_pkg="$(find bin -type f \( -name "luci-app-dashboard_*.${ext}" -o -name "luci-app-dashboard-*.${ext}" \) ! -name "luci-i18n-*" | sort | head -n 1)"
          i18n_pkg="$(find bin -type f \( -name "luci-i18n-dashboard-zh-cn_*.${ext}" -o -name "luci-i18n-dashboard-zh-cn-*.${ext}" \) | sort | head -n 1)"

          if [ -z "$app_pkg" ] || [ -z "$i18n_pkg" ]; then
            echo "::error::DEBUG bin tree:"
            find bin -type f 2>/dev/null | sort | head -60 || true
            echo "::error::DEBUG luci find: $(find bin -type f -name "*dashboard*" 2>/dev/null | tr '\n' ' ')"
            echo "Missing luci packages (${ext})" && exit 1
          fi

          cp -f "$app_pkg" "dist/luci-app-dashboard${suffix}.${ext}"
          cp -f "$i18n_pkg" "dist/luci-i18n-dashboard-zh-cn${suffix}.${ext}"
          cp -f install.sh dist/install.sh
          chmod 755 dist/install.sh

          echo "LuCI release assets:"
          ls -lah dist

      - name: Upload LuCI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-luci-assets-${{ matrix.ver }}
          path: dist/*
          if-no-files-found: error

  build-core:
    name: Build dashboard-core (${{ matrix.sdk_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_arch: mediatek-filogic-24.10.5
            ver: "24.10"
            aliases: ""
          - sdk_arch: armsr-armv8-24.10.5
            ver: "24.10"
            aliases: "aarch64 armv8"
          - sdk_arch: armsr-armv7-24.10.5
            ver: "24.10"
            aliases: "armv7"
          - sdk_arch: x86-64-24.10.5
            ver: "24.10"
            aliases: "x86"
          - sdk_arch: mediatek-filogic-25.12.5
            ver: "25.12"
            aliases: ""
          - sdk_arch: armsr-armv8-25.12.5
            ver: "25.12"
            aliases: "aarch64 armv8"
          - sdk_arch: armsr-armv7-25.12.5
            ver: "25.12"
            aliases: "armv7"
          - sdk_arch: x86-64-25.12.5
            ver: "25.12"
            aliases: "x86"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local feed layout
        run: |
          rm -rf .feed
          mkdir -p .feed/${{ env.PKG_NAME }}
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.feed' \
            ./ ./.feed/${{ env.PKG_NAME }}/

      - name: Build backend package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_arch }}
          FEED_DIR: ${{ github.workspace }}/.feed
          PACKAGES: dashboard-core
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Collect backend assets
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          ver="${{ matrix.ver }}"
          if [ "$ver" = "24.10" ]; then
            suffix=""
            ext="ipk"
          else
            suffix="-$ver"
            ext="apk"
          fi

          echo "## Collect 诊断 (ver=$ver, ext=$ext)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sdk_arch: ${{ matrix.sdk_arch }}" >> "$GITHUB_STEP_SUMMARY"

          echo "All built packages (${ext}):"
          find bin -type f -name "*.${ext}" | sort | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/  /'

          # ipk 命名: dashboard-core_0.2.0-1_arch.ipk (下划线)
          # apk 命名: dashboard-core-0.2.0-r1.apk (横线)
          # 统一用 dashboard-core[_-]* 匹配两种格式
          core_pkg="$(find bin -type f \( -name "dashboard-core_*.${ext}" -o -name "dashboard-core-*.${ext}" \) | sort | head -n 1)"
          echo "- core_pkg: \`${core_pkg:-EMPTY}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$core_pkg" ]; then
            echo "- 全部 core 相关文件:" >> "$GITHUB_STEP_SUMMARY"
            find bin -type f -iname "*dashboard*" 2>/dev/null | sort | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/  /' || true
            echo "Missing dashboard-core ${ext}" && exit 1
          fi

          # ipk: dashboard-core_0.2.0-1_aarch64_generic.ipk → arch=aarch64_generic
          # apk: bin/packages/aarch64_cortex-a53/action/dashboard-core-0.2.0-r1.apk → arch 从路径提取
          if [ "$ext" = "ipk" ]; then
            core_arch="$(basename "$core_pkg" ".${ext}" | sed -E 's/^dashboard-core_[^_]+_(.+)$/\1/')"
          else
            # apk: 从路径 bin/packages/<arch>/action/ 提取架构
            core_arch="$(echo "$core_pkg" | sed -E 's|.*bin/packages/([^/]+)/action/.*|\1|')"
          fi
          echo "- core_arch: \`${core_arch:-EMPTY}\`" >> "$GITHUB_STEP_SUMMARY"
          test -n "$core_arch" || (echo "::error::Cannot parse dashboard-core architecture from $core_pkg" && exit 1)

          cp -f "$core_pkg" "dist/dashboard-core-${core_arch}${suffix}.${ext}"
          core_out="dist/dashboard-core-${core_arch}${suffix}"
          core_tmp="$(mktemp -d)"
          extract_ok=0

          if [ "$ext" = "apk" ]; then
            # ---- apk v3 (ADB 容器) 格式：必须用 apk-tools 解包 ----
            echo "- 提取: apk v3 容器 → apk-tools 解包" >> "$GITHUB_STEP_SUMMARY"
            # runner 是 x86_64，下载静态 apk 二进制
            APK_TOOL="$GITHUB_WORKSPACE/.github/bin/apk.static"
            # apk.static 已内置仓库（x86_64 静态二进制），无需外部下载
            if [ ! -s "$APK_TOOL" ]; then
              echo "::error::仓库内 apk.static 缺失" && exit 1
            fi
            chmod +x "$APK_TOOL"
            "$APK_TOOL" --version >/dev/null 2>&1 || { echo "::error::apk-tools 不是 x86_64 可执行" && exit 1; }
            mkdir -p "$core_tmp/root"
            ( cd "$core_tmp/root" && "$APK_TOOL" extract --allow-untrusted "$GITHUB_WORKSPACE/$core_pkg" >/dev/null 2>&1 )
            if [ -f "$core_tmp/root/usr/bin/dashboard-core" ]; then
              cp -f "$core_tmp/root/usr/bin/dashboard-core" "$core_out"
              extract_ok=1
              echo "- apk 解包成功 → usr/bin/dashboard-core" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::apk 解包后未找到 usr/bin/dashboard-core; 已解包文件: $(find "$core_tmp/root" -type f 2>/dev/null | head -10 | tr '\n' ' ')"
            fi
          else
            # ---- ipk：tar 格式（外层 debian-binary+control.tar.gz+data.tar.gz）或 ar 归档 ----
            extract_from_tar() {
              archive="$1"
              entry="$(tar -tf "$archive" 2>/dev/null | grep -E '(^|/)usr/bin/dashboard-core$' | head -n 1 || true)"
              if [ -z "$entry" ]; then
                echo "::error::DEBUG no usr/bin/dashboard-core in $archive; entries: $(tar -tf "$archive" 2>&1 | head -10 | tr '\n' ' ')"
                return 1
              fi
              tar -xOf "$archive" "$entry" > "$core_out"
            }
            # 尝试直接当 tar 处理（tar 格式 ipk / 内层 data.tar.gz）
            if tar -tf "$core_pkg" >/dev/null 2>&1; then
              echo "- ipk tar 分支: 外层 tar 直接可读" >> "$GITHUB_STEP_SUMMARY"
              data_entry="$(tar -tf "$core_pkg" | grep -E '(^|/)data\.tar\.' | head -n 1 || true)"
              if [ -n "$data_entry" ]; then
                data_archive="$core_tmp/$(basename "$data_entry")"
                tar -xOf "$core_pkg" "$data_entry" > "$data_archive" || true
                echo "- 提取内层: $data_entry" >> "$GITHUB_STEP_SUMMARY"
                if [ -s "$data_archive" ]; then
                  extract_from_tar "$data_archive" && extract_ok=1 || true
                fi
              fi
              if [ "$extract_ok" -ne 1 ]; then
                extract_from_tar "$core_pkg" && extract_ok=1 || true
              fi
            elif tar -tzf "$core_pkg" >/dev/null 2>&1; then
              echo "- ipk gzip tar 分支" >> "$GITHUB_STEP_SUMMARY"
              data_entry="$(tar -tzf "$core_pkg" | grep -E '(^|/)data\.tar\.' | head -n 1 || true)"
              if [ -n "$data_entry" ]; then
                data_archive="$core_tmp/$(basename "$data_entry")"
                tar -xzOf "$core_pkg" "$data_entry" > "$data_archive" || true
                if [ -s "$data_archive" ]; then
                  extract_from_tar "$data_archive" && extract_ok=1 || true
                fi
              fi
              if [ "$extract_ok" -ne 1 ]; then
                extract_from_tar "$core_pkg" && extract_ok=1 || true
              fi
            fi
          fi

          rm -rf "$core_tmp"
          echo "- extract_ok: $extract_ok" >> "$GITHUB_STEP_SUMMARY"
          test "$extract_ok" -eq 1 || (echo "Cannot extract dashboard-core from $core_pkg" && exit 1)
          core_size="$(wc -c < "$core_out")"
          echo "- core_size: $core_size bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$core_size" -gt 4096 || (echo "Extracted dashboard-core looks too small: ${core_size} bytes" && exit 1)

          aliases="${{ matrix.aliases }}"
          for alias in $aliases; do
            cp -f "$core_pkg" "dist/dashboard-core-${alias}${suffix}.${ext}"
            cp -f "$core_out" "dist/dashboard-core-${alias}${suffix}"
          done
          chmod 755 dist/dashboard-core-*

          echo "Backend release assets:"
          ls -lah dist

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-core-${{ matrix.sdk_arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-luci
      - build-core
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download LuCI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-luci-assets-*
          path: dist
          merge-multiple: true

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-core-*
          path: dist
          merge-multiple: true

      - name: Show release files
        run: |
          set -euo pipefail
          ls -lah dist

          test -f dist/install.sh || (echo "Missing install.sh" && exit 1)
          test -f dist/luci-app-dashboard.ipk || (echo "Missing luci-app-dashboard.ipk (24.10)" && exit 1)
          test -f dist/luci-i18n-dashboard-zh-cn.ipk || (echo "Missing luci-i18n-dashboard-zh-cn.ipk (24.10)" && exit 1)
          test -f dist/luci-app-dashboard-25.12.apk || (echo "Missing luci-app-dashboard-25.12.apk" && exit 1)
          test -f dist/luci-i18n-dashboard-zh-cn-25.12.apk || (echo "Missing luci-i18n-dashboard-zh-cn-25.12.apk" && exit 1)
          compgen -G "dist/dashboard-core-*" >/dev/null || (echo "Missing dashboard-core assets" && exit 1)
          compgen -G "dist/dashboard-core-*.ipk" >/dev/null || (echo "Missing dashboard-core 24.10 IPKs" && exit 1)
          compgen -G "dist/dashboard-core-*.apk" >/dev/null || (echo "Missing dashboard-core 25.12 APKs" && exit 1)
          test -f dist/dashboard-core-aarch64.ipk || (echo "Missing dashboard-core-aarch64.ipk (24.10)" && exit 1)
          test -f dist/dashboard-core-armv8.ipk || (echo "Missing dashboard-core-armv8.ipk (24.10)" && exit 1)
          test -f dist/dashboard-core-armv7.ipk || (echo "Missing dashboard-core-armv7.ipk (24.10)" && exit 1)
          test -f dist/dashboard-core-x86.ipk || (echo "Missing dashboard-core-x86.ipk (24.10)" && exit 1)
          test -f dist/dashboard-core-aarch64-25.12.apk || (echo "Missing dashboard-core-aarch64-25.12.apk" && exit 1)
          test -f dist/dashboard-core-armv8-25.12.apk || (echo "Missing dashboard-core-armv8-25.12.apk" && exit 1)
          test -f dist/dashboard-core-armv7-25.12.apk || (echo "Missing dashboard-core-armv7-25.12.apk" && exit 1)
          test -f dist/dashboard-core-x86-25.12.apk || (echo "Missing dashboard-core-x86-25.12.apk" && exit 1)
          ! compgen -G "dist/dashboard-core.ipk" >/dev/null || (echo "dashboard-core.ipk must not be released as a generic asset" && exit 1)
          ! compgen -G "dist/kmod-dashboard-monitor_*.ipk" >/dev/null || (echo "kmod assets must not be released" && exit 1)

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
